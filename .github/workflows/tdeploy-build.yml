name: ABLE WAY T-DEPLOY - Deterministic Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools and Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Prepare Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore
          echo "debug.keystore ready."

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Debug AAB
        run: ./gradlew :app:bundleDebug --no-daemon --stacktrace

      - name: Verify Generated Artifacts
        run: |
          echo "=== Verifying Generated Artifacts ==="
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/bundle/debug/app-debug.aab
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdeploy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Debug AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdeploy-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 14
