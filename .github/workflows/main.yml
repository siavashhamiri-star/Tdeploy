name: T-Deploy Universal Android Builder

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "GitHub repository (owner/name)"
        required: true
        type: string
      branch:
        description: "Branch to build"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Universal Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout T-Deploy
        uses: actions/checkout@v4

      - name: Checkout Target Project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: target
          fetch-depth: 1

      - name: Inspect Target Project
        working-directory: target
        shell: bash
        run: |
          echo "======================================"
          echo "T-DEPLOY TARGET PROJECT"
          echo "======================================"
          echo "Repository: ${{ inputs.repository }}"
          echo "Branch:     ${{ inputs.branch }}"
          echo
          echo "Top-level files:"
          ls -la
          echo
          echo "Android / Gradle / Node files:"
          find . -maxdepth 4 \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "package.json" \
            -o -name "capacitor.config.ts" \
            -o -name "capacitor.config.json" \) \
            -print | sort

      - name: Detect Project Type
        id: detect
        working-directory: target
        shell: bash
        run: |
          set -e

          echo "Detecting Android project..."

          if [ -f "gradlew" ] && [ -d "app" ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
            echo "android_dir=." >> "$GITHUB_OUTPUT"
            echo "Detected: Native Android at repository root"

          elif [ -f "android/gradlew" ] && [ -d "android/app" ]; then
            echo "type=native-subdir" >> "$GITHUB_OUTPUT"
            echo "android_dir=android" >> "$GITHUB_OUTPUT"
            echo "Detected: Native Android under android/"

          elif [ -f "capacitor.config.ts" ] || [ -f "capacitor.config.json" ]; then
            echo "type=hybrid" >> "$GITHUB_OUTPUT"
            echo "android_dir=android" >> "$GITHUB_OUTPUT"
            echo "Detected: Capacitor / Hybrid"

          elif [ -f "package.json" ] && grep -q '"@capacitor/' package.json; then
            echo "type=hybrid" >> "$GITHUB_OUTPUT"
            echo "android_dir=android" >> "$GITHUB_OUTPUT"
            echo "Detected: Capacitor / Hybrid"

          else
            echo "ERROR: Supported Android project not detected."
            echo
            echo "Complete project structure:"
            find . -maxdepth 4 -type f | sort | head -500
            exit 1
          fi

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'hybrid'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node Dependencies
        if: steps.detect.outputs.type == 'hybrid'
        working-directory: target
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Application
        if: steps.detect.outputs.type == 'hybrid'
        working-directory: target
        shell: bash
        run: |
          set -e

          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No npm build script found."
            echo "Continuing with existing Android project."
          fi

      - name: Sync Capacitor
        if: steps.detect.outputs.type == 'hybrid'
        working-directory: target
        shell: bash
        run: |
          set -e

          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "ERROR: Capacitor project has no android directory."
            exit 1
          fi

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare Gradle Wrapper
        working-directory: target
        shell: bash
        run: |
          set -e

          if [ "${{ steps.detect.outputs.android_dir }}" = "." ]; then
            chmod +x ./gradlew
          else
            chmod +x android/gradlew
          fi

      - name: Build Root Android Project
        if: steps.detect.outputs.type == 'native'
        working-directory: target
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Build Android Subdirectory Project
        if: steps.detect.outputs.type == 'native-subdir' || steps.detect.outputs.type == 'hybrid'
        working-directory: target/android
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug --stacktrace --no-daemon
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          ./gradlew :app:bundleRelease --stacktrace --no-daemon

      - name: Find Build Artifacts
        id: artifacts
        working-directory: target
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD ARTIFACTS"
          echo "======================================"

          find . -path "*/build/outputs/*" -type f | sort

          DEBUG_APK=$(find . \
            -path "*/build/outputs/apk/debug/*.apk" \
            -type f | head -1)

          RELEASE_APK=$(find . \
            -path "*/build/outputs/apk/release/*.apk" \
            -type f | head -1)

          RELEASE_AAB=$(find . \
            -path "*/build/outputs/bundle/release/*.aab" \
            -type f | head -1)

          if [ -z "$DEBUG_APK" ]; then
            echo "ERROR: Debug APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          if [ -z "$RELEASE_AAB" ]; then
            echo "ERROR: Release AAB not found."
            exit 1
          fi

          echo "DEBUG_APK=$DEBUG_APK" >> "$GITHUB_OUTPUT"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "RELEASE_AAB=$RELEASE_AAB" >> "$GITHUB_OUTPUT"

          echo
          echo "Debug APK:   $DEBUG_APK"
          echo "Release APK: $RELEASE_APK"
          echo "Release AAB: $RELEASE_AAB"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: T-Deploy-Debug-APK
          path: target/${{ steps.artifacts.outputs.DEBUG_APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: T-Deploy-Release-APK
          path: target/${{ steps.artifacts.outputs.RELEASE_APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: T-Deploy-Release-AAB
          path: target/${{ steps.artifacts.outputs.RELEASE_AAB }}
          if-no-files-found: error
          retention-days: 7
